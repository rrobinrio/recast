services:
  recast:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      APP_ORIGIN: ${APP_ORIGIN:?Set your HTTPS app URL}
      PUBLIC_MEDIA_BASE_URL: ${APP_ORIGIN:?Set your HTTPS app URL}
    volumes:
      - recast-data:/data
      - ./deploy/recast.env:/run/secrets/recast.env:ro
volumes:
  recast-data:
